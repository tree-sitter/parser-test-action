version: 2
updates:
  - package-ecosystem: github-actions
    directory: /go/
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(go)
    groups:
      go:
        patterns: ["*"]
    labels: [dependencies]
