name: Tree-sitter parser test (Zig)
description: Test a tree-sitter parser in Zig

inputs:
  zig-version:
    description: Zig version
    default: "0.16.0"

runs:
  using: composite
  steps:
    - name: Set up Zig
      uses: vercel-labs/setup-zig@v1
      with:
        version: ${{inputs.zig-version}}
    - name: Build module
      shell: sh
      run: zig build
    - name: Run tests
      shell: sh
      run: zig build test
